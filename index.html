<style>
:root {
  /* Forge: cool steel neutrals, one brass accent (the forge), tone colours carry meaning. */
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #eceef2;
  --ink: #15181e;
  --muted: #5a616e;
  --line: #d8dbe1;
  --accent: #8a5a12;
  --accent-ink: #ffffff;
  --accent-soft: #f3e7d2;
  --good: #23824d;
  --warn: #a86400;
  --bad: #b4352b;
  --t1: #c9302c;
  --t2: #23824d;
  --t3: #2a62c9;
  --t4: #8a3fbf;
  --t5: #7b818c;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-han: "Noto Serif SC", "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20, 24, 31, .06), 0 4px 14px rgba(20, 24, 31, .05);
  color-scheme: light;
  /* layout: one 720px column, a fixed action bar during sessions */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #191c22; --surface-2: #22262e; --ink: #e9ebef; --muted: #9ca3af;
    --line: #2c313a; --accent: #d9a441; --accent-ink: #1a1306; --accent-soft: #3a2e17;
    --good: #4cc07e; --warn: #e2a33b; --bad: #ee6b5f;
    --t1: #ff6b62; --t2: #4cc07e; --t3: #6f9cff; --t4: #c48af0; --t5: #9ca3af;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #191c22; --surface-2: #22262e; --ink: #e9ebef; --muted: #9ca3af;
  --line: #2c313a; --accent: #d9a441; --accent-ink: #1a1306; --accent-soft: #3a2e17;
  --good: #4cc07e; --warn: #e2a33b; --bad: #ee6b5f;
  --t1: #ff6b62; --t2: #4cc07e; --t3: #6f9cff; --t4: #c48af0; --t5: #9ca3af;
  --shadow: none; color-scheme: dark;
}
/* E-ink: pure black on white, no motion, heavier lines, tones shown by number not colour. */
:root[data-eink="1"] {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #ffffff; --ink: #000000; --muted: #222222;
  --line: #000000; --accent: #000000; --accent-ink: #ffffff; --accent-soft: #ffffff;
  --good: #000000; --warn: #000000; --bad: #000000;
  --t1: #000; --t2: #000; --t3: #000; --t4: #000; --t5: #000;
  --shadow: none; color-scheme: light;
}
:root[data-eink="1"] * { transition: none !important; animation: none !important; }
:root[data-eink="1"] .card, :root[data-eink="1"] .tile, :root[data-eink="1"] .btn { border-width: 2px; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
:root[data-eink="1"] body { font-size: 18px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 120px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .78rem; }
.han { font-family: var(--font-han); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.grow { flex: 1; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; }
.seal {
  width: 40px; height: 40px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-han); font-size: 24px; font-weight: 700; flex: none;
}
.brand { font-weight: 600; font-size: 1.1rem; letter-spacing: .01em; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); font-size: .78rem; color: var(--muted); background: var(--surface);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.ok .dot { background: var(--good); }
.chip.warn .dot { background: var(--warn); }

/* Cards and tiles */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
  display: flex; flex-direction: column; gap: 2px; text-align: left; color: var(--ink); font: inherit; cursor: pointer; min-height: 76px;
}
.tile:hover { border-color: var(--accent); }
.tile .glyph { font-family: var(--font-han); font-size: 1.4rem; line-height: 1.1; }
.tile b { font-weight: 600; font-size: .95rem; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.stat .v { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .k { font-size: .78rem; color: var(--muted); }

/* Buttons */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
  font-weight: 500; padding: 10px 16px; border-radius: 10px; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; min-height: 56px; font-size: 1.05rem; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn:focus-visible, .tile:focus-visible, .tok:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 2px;
}
.iconbtn { width: 44px; padding: 0; }
.grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.grades .btn { flex-direction: column; gap: 0; line-height: 1.2; padding: 8px 4px; }
.grades .btn small { font-size: .72rem; color: var(--muted); font-weight: 400; }
.grades .g1 { border-color: var(--bad); }
.grades .g3 { border-color: var(--good); }

/* Progress */
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.steps { display: flex; gap: 6px; }
.steps span { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); }
.steps span.done { background: var(--accent); border-color: var(--accent); }
.steps span.now { background: var(--accent-soft); border-color: var(--accent); }

/* Word display */
.hero-han { font-family: var(--font-han); font-size: clamp(3.4rem, 14vw, 5.5rem); line-height: 1.1; text-align: center; font-weight: 600; }
.hero-py { font-size: 1.5rem; text-align: center; font-weight: 500; letter-spacing: .01em; }
.hero-en { font-size: 1.1rem; text-align: center; }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }
:root[data-eink="1"] .tone-num::after { content: attr(data-n); font-size: .6em; vertical-align: super; }
.comps { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.comp { border: 1px dashed var(--line); border-radius: 8px; padding: 4px 8px; font-size: .85rem; }
.comp .han { font-size: 1.1rem; margin-right: 4px; }
.sent { background: var(--surface-2); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.sent .zh { font-family: var(--font-han); font-size: 1.3rem; }
.center { text-align: center; }
.prompt-icon { font-size: 3rem; text-align: center; }

/* Reading */
.line { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: none; }
.line .zh { font-family: var(--font-han); font-size: 1.35rem; line-height: 1.7; }
.tok { background: none; border: none; font: inherit; color: inherit; padding: 0 1px; border-radius: 4px; cursor: pointer; }
.tok.unk { text-decoration: underline dotted var(--bad); text-underline-offset: 6px; }
.tok.new { text-decoration: underline var(--accent); text-underline-offset: 6px; text-decoration-thickness: 2px; }
.tok:hover { background: var(--accent-soft); }
.line .py { font-size: .9rem; color: var(--muted); }
.line .en { font-size: .9rem; }
.badge { font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.good { color: var(--good); border-color: var(--good); }
.badge.warn { color: var(--warn); border-color: var(--warn); }

/* Options */
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt { min-height: 56px; font-size: 1.1rem; }
.nw { white-space: nowrap; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
:root[data-eink="1"] .opt.right { border-width: 4px; background: #fff; }
:root[data-eink="1"] .opt.wrong { border-style: dashed; background: #fff; }

/* Bottom bar */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 92%, transparent);
  border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  backdrop-filter: blur(8px);
}
:root[data-eink="1"] .dock { background: #fff; backdrop-filter: none; border-top-width: 2px; }
.dock .in { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

/* Pitch canvas */
.pitch { width: 100%; height: 170px; display: block; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.verdict { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.verdict > span { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: .9rem; }
.verdict > .ok { border-color: var(--good); color: var(--good); }
.verdict > .no { border-color: var(--bad); color: var(--bad); }
.rec { border-color: var(--bad); color: var(--bad); }
.rec.on { background: var(--bad); color: #fff; }

/* Sheet */
.sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
}
.sheet .in { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: .9rem; z-index: 30; max-width: 90vw; text-align: center;
}

/* Lists and forms */
.list { display: flex; flex-direction: column; }
.item { display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.item .han { font-size: 1.4rem; min-width: 3.2em; }
.pill { font-size: .72rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.known { color: var(--good); border-color: var(--good); }
.pill.learning { color: var(--warn); border-color: var(--warn); }
label { font-size: .9rem; font-weight: 500; }
input[type=text], input[type=password], input[type=number], select, textarea {
  font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%;
}
textarea { min-height: 90px; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink); font: inherit; padding: 8px 14px; cursor: pointer; min-height: 40px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button + button { border-left: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: .8rem; color: var(--muted); }
.hw { width: 260px; height: 260px; margin: 0 auto; background: var(--surface-2); border-radius: 12px; border: 1px solid var(--line); touch-action: none; }
:root[data-eink="1"] .hw { border-width: 2px; }
.realm-zh { font-family: var(--font-han); font-size: 1.8rem; font-weight: 700; }
.gate { display: flex; gap: 8px; align-items: center; font-size: .88rem; }
.gate .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .75rem; flex: none; }
.gate .box.on { background: var(--good); border-color: var(--good); color: #fff; }
.report li { margin: 2px 0; }
.report ul { margin: 4px 0 0; padding-left: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Drive mode: always dark, huge targets, glance-free */
body.drive-on { background: #0b0d10; }
.drive {
  --t1: #ff6b62; --t2: #4cc07e; --t3: #6f9cff; --t4: #c48af0; --t5: #9ca3af;
  max-width: 720px; margin: 0 auto; min-height: 100%; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px; color: #f2f3f5; background: #0b0d10; color-scheme: dark;
}
.drv-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.drv-status { font-size: 1rem; padding: 6px 14px; border-radius: 99px; border: 1px solid #343a44; color: #c8ccd3; min-height: 34px; }
.drv-status.listening { background: #c0392b; border-color: #c0392b; color: #fff; font-weight: 600; }
.drv-status:empty { visibility: hidden; }
.drv-end { color: #c8ccd3; border-color: #343a44; background: transparent; }
.drv-card { flex: 1; min-height: 42vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; }
.drv-kind { color: #9aa3af; text-transform: uppercase; letter-spacing: .08em; font-size: .82rem; }
.drv-han { font-family: var(--font-han); font-size: clamp(4rem, 22vw, 7.5rem); line-height: 1.05; font-weight: 600; }
.drv-han.small { font-size: clamp(1.7rem, 7vw, 2.6rem); }
.drv-han.muted { color: #3a404a; }
.drv-py { font-size: 1.7rem; font-weight: 500; }
.drv-en { font-size: 1.5rem; }
.drv-res { font-size: 1.5rem; font-weight: 700; }
.drv-res.ok { color: #4cc07e; } .drv-res.tone { color: #e2a33b; } .drv-res.miss { color: #ee6b5f; }
.drv-heard { color: #9aa3af; font-size: 1rem; }
.drv-stats { display: flex; gap: 16px; justify-content: center; color: #9aa3af; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.drv-pause { width: 100%; min-height: 26vh; font: inherit; font-size: 2.2rem; font-weight: 700; border-radius: 22px; border: 2px solid #3a404a; background: #171b21; color: #fff; cursor: pointer; }
.drv-pause:focus-visible { outline: 3px solid #d9a441; outline-offset: 3px; }

.tch-en { font-size: 1.25rem; line-height: 1.45; color: #e6e8eb; max-width: 34ch; }
.tch-type { display: flex; gap: 8px; }
.tch-type input { background: #171b21; color: #fff; border-color: #3a404a; font-size: 1.1rem; }
.drv-pause.short { min-height: 12vh; font-size: 1.6rem; }

.banner { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 60; background: var(--surface, #fff); color: var(--ink, #111); border: 2px solid var(--bad, #b4352b); border-radius: 14px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.18); display: grid; gap: 4px; }
.banner[hidden] { display: none; }

</style>

/* ---------- stroke data: embedded, or fetched from the Hanzi Writer CDN ---------- */
const hasStrokes = c => !D.strokes || !!D.strokes[c];
function strokeLoader(c, ok, fail) {
  if (D.strokes && D.strokes[c]) return ok(D.strokes[c]);
  fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0.1/${encodeURIComponent(c)}.json`).then(r => r.json()).then(ok).catch(fail || (() => { }));
}
/* ---------- after-render hooks ---------- */
function after() {
  if (UI.view === 'write') mountWriter();
  if (UI.view === 'session' && SES && SES.steps[SES.i] === 'ear' && SES.ear[SES.earK] && SES.ear[SES.earK].picked === null && !SES.ear[SES.earK].played) { /* audio needs a tap on iOS; wait for Play */ }
}
function mountWriter() {
  const el = $('#hw'); if (!el || typeof HanziWriter === 'undefined') return;
  const ch = UI.writeChar || $('#hw-pick')?.value; if (!ch || !hasStrokes(ch)) { $('#hw-msg').textContent = 'No stroke data for this character yet.'; return; }
  const css = getComputedStyle(document.documentElement);
  el.innerHTML = '';
  HW = HanziWriter.create(el, ch, {
    width: 260, height: 260, padding: 14, showCharacter: false, showOutline: false, showHintAfterMisses: 3,
    strokeColor: css.getPropertyValue('--ink').trim(), outlineColor: css.getPropertyValue('--line').trim(), drawingColor: css.getPropertyValue('--accent').trim(),
    highlightColor: css.getPropertyValue('--good').trim(), drawingWidth: S.settings.eink ? 26 : 18,
    strokeAnimationSpeed: S.settings.eink ? 3 : 1, delayBetweenStrokes: S.settings.eink ? 0 : 250, strokeFadeDuration: S.settings.eink ? 0 : 400,
    charDataLoader: strokeLoader,
  });
  HW.quiz({
    onComplete: sum => {
      const r = (S.writing[ch] ||= { n: 0, miss: 0 }); r.n++; r.miss = sum.totalMistakes; r.last = Date.now(); addQi(3); persist();
      const m = $('#hw-msg'); if (m) m.textContent = sum.totalMistakes ? `Done with ${sum.totalMistakes} mistake${sum.totalMistakes > 1 ? 's' : ''}. Again, or next.` : 'Clean. No mistakes.';
    },
  });
}

async function genStory(track) {
  const allowed = [...seenSet()];
  const targets = shuffle(dueList()).slice(0, 4).concat(shuffle(allowed).slice(0, 2));
  const theme = track === 'f' ? 'a business meeting or factory visit between an Indian fastener manufacturer (Sandesh, from Kurnool) and Chinese partners (张总)' : 'a xianxia story about a disciple in a cultivation sect';
  const prompt = `You write graded Mandarin reading practice for one adult learner.
Theme: ${theme}.
Write 7 to 9 short sentences in simplified Chinese that tell one small story.
Rules:
- Use ONLY words from this list, plus the particles 了 吗 吧 呢, the words 但是 问 会 一下 这个, and the names Sandesh and 张总: ${allowed.join(' ')}
- Use each of these words at least once: ${[...new Set(targets)].join(' ')}
- At most 14 Chinese characters per sentence. Natural Mandarin a native speaker would say.
Return ONLY JSON, nothing else:
{"title":"<Chinese title, 2-6 characters>","en":"<English title>","lines":[["<sentence>","<pinyin with tone marks, words separated by spaces>","<English>"]],"qs":[{"q":"<question in Chinese using allowed words>","en":"<English>","o":["<correct answer>","<wrong>","<wrong>"],"a":0}]}
Exactly 2 questions.`;
  UI.gen = true; render();
  try {
    let text = '';
    if (SAMPLE) { const r = await SAMPLE(prompt, { modelTier: 'default' }); text = r.text; }
    else text = await chatLLM([{ role: 'user', content: prompt }], { json: true, max: 2000, temp: 0.7 });
    const js = JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1));
    if (!Array.isArray(js.lines) || !js.lines.length) throw new Error('bad shape');
    const st = { id: 'g' + Date.now(), track, gen: true, title: String(js.title || '新故事'), en: String(js.en || 'New story'), lines: js.lines.filter(l => Array.isArray(l) && l[0]).map(l => [String(l[0]), String(l[1] || ''), String(l[2] || '')]), qs: (js.qs || []).filter(q => q && Array.isArray(q.o) && q.o.length >= 2).slice(0, 2).map(q => ({ q: String(q.q), en: String(q.en || ''), o: q.o.map(String), a: Number(q.a) || 0 })) };
    const cov = coverage(st.lines.map(l => l[0]), new Set(allowed));
    S.stories.push(st); persist();
    UI.storyId = st.id; toast(`Story ready: ${Math.round(cov * 100)}% of its words are yours${cov < 0.9 ? ' (harder than target; dotted words are new)' : ''}.`);
  } catch (e) {
    toast(e && e.code === 'not_granted' ? 'Story writing was not allowed.' : e && e.code === 'rate_limited' ? 'Too many requests. Try again in a minute.' : 'Could not write a story this time. Try again.');
  }
  UI.gen = false; render();
}

Object.assign(ACT, {

/* ---------- natural voice: Qwen3-TTS through Forge's relay, cached on the device; device voice is the fallback ---------- */
const TTS_VOICES = {
  gemini: [['Kore', 'Kore · firm, clear'], ['Sulafat', 'Sulafat · warm'], ['Vindemiatrix', 'Vindemiatrix · gentle'], ['Aoede', 'Aoede · breezy'], ['Leda', 'Leda · youthful'], ['Achernar', 'Achernar · soft'], ['Charon', 'Charon · informative'], ['Iapetus', 'Iapetus · clear'], ['Puck', 'Puck · upbeat'], ['Orus', 'Orus · firm']],
  deepinfra: [['Vivian', 'Vivian · female'], ['Serena', 'Serena · female'], ['Uncle_Fu', 'Uncle Fu · older male']],
  qwen: [['Cherry', 'Cherry · warm female'], ['Serena', 'Serena · calm female'], ['Chelsie', 'Chelsie · bright female'], ['Momo', 'Momo · young female'], ['Vivian', 'Vivian · female'], ['Maia', 'Maia · female'], ['Ethan', 'Ethan · male, standard'], ['Moon', 'Moon · male'], ['Kai', 'Kai · male'], ['Ryan', 'Ryan · male']],

const TTS = { el: null, mem: new Map(), inflight: new Map(), bad: '', db: null, playing: null, epoch: 0, unlocked: false, active: 0, q: [], cool: 0 };
const TTS_NAMES = { gemini: 'Google Gemini voice', deepinfra: 'Qwen3-TTS (open model, via DeepInfra)', qwen: 'Qwen3-TTS (Alibaba)' };
function ttsProvs() { return ['gemini', 'deepinfra', 'qwen'].filter(p => KEYS[p]); }
function ttsProv() { const ok = ttsProvs(); return ok.includes(S.settings.ttsEngine) ? S.settings.ttsEngine : (ok[0] || ''); }
function ttsPool() { return (TTS_VOICES[ttsProv()] || []).map(v => v[0]); }
function cloudVoiceOn() { return HAS_RELAY && !!ttsProv() && S.settings.voiceEngine !== 'device' && !TTS.bad; }
function mainCloudVoice() { const pool = ttsPool(), pick = (S.settings.cloudVoices || {})[ttsProv()] || S.settings.cloudVoice; return pool.includes(pick) ? pick : (pool[0] || ''); }
const ttsKey = (text, voice, lang, slow) => ttsProv() + '|' + voice + '|' + lang + (slow ? '|slow' : '') + '|' + text;
function ttsDB() {
  if (!TTS.db) TTS.db = new Promise(res => { try { const r = indexedDB.open('forge-tts', 1); r.onupgradeneeded = () => r.result.createObjectStore('clips'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } });

}
async function dbGet(k) { const db = await ttsDB(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('clips').objectStore('clips').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }

  if (TTS.mem.has(k)) return Promise.resolve(TTS.mem.get(k));

function ttsNotice() {

  try { const a = ttsEl(); a.src = SILENT; const p = a.play(); if (p) p.catch(() => { TTS.unlocked = false; }); } catch (e) { TTS.unlocked = false; }

document.addEventListener('pointerdown', unlockAudio, true);
function playUrl(url, rate) {
  return new Promise(res => {
    if (TTS.playing) TTS.playing(true);
    const a = ttsEl(); let done = false, t = 0, started = false;

function hushAll() {

const cloudRate = r => clamp((r ?? S.settings.rate) + 0.05, 0.7, 1.15);
const within = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), ms))]);
async function cloudSay(text, voice, lang, rate, slow) {
  const ep = TTS.epoch;

  const url = await within(clip(text, voice, lang, { now: true, slow }), 7000).catch(e => { if (e && e.message === 'slow') logProblem('voice', 'Natural voice too slow (over 7 s); used the phone voice', text.slice(0, 40)); else if (e && !['off', 'cooling', 'badkey', 'denied', 'nofunds', 'rate'].includes(e.message)) logProblem('voice', 'Natural voice failed', (e.message || e) + ''); return null; });

async function say(text, o = {}) {

  const slow = ttsProv() === 'gemini' && (o.rate ?? S.settings.rate) <= 0.72;
  if (cloudVoiceOn() && /\p{Script=Han}/u.test(text) && await cloudSay(text, o.cloud || mainCloudVoice(), 'Chinese', slow ? 1 : cloudRate(o.rate), slow)) return;

}
async function sayEn(text) {

}

let PREFETCH_T = 0;
function prefetchVisible() { // warm the clips for every ▶ button on screen
  if (!cloudVoiceOn()) return;
  clearTimeout(PREFETCH_T);
  PREFETCH_T = setTimeout(() => prefetchZh([...document.querySelectorAll('[data-say]')].slice(0, 16).map(b => b.dataset.say)), 250);
}

const AB_LINES = ['欢迎参观我们的工厂。', '我们的产品质量很好，价格也很合理。', '你好，我叫 Sandesh，很高兴认识你。'];
async function abPlay() {
  const provs = ttsProvs().filter(p => p !== 'qwen' || HAS_RELAY);
  if (provs.length < 2) { toast('Add both keys first.'); return; }
  const line = AB_LINES[(UI.abRound || 0) % AB_LINES.length];
  const order = Math.random() < 0.5 ? provs.slice(0, 2) : provs.slice(0, 2).reverse();
  UI.ab = { order, line, busy: true }; render();
  const keep = S.settings.ttsEngine;
  for (const [i, p] of order.entries()) {
    S.settings.ttsEngine = p; toast(i ? 'Voice B' : 'Voice A');
    await say(line); await sleep(500);
  }
  S.settings.ttsEngine = keep;
  if (UI.ab) { UI.ab.busy = false; render(); }
}
function abPick(i) {
  if (!UI.ab || UI.ab.busy) return;
  const win = UI.ab.order[i]; UI.abVotes = UI.abVotes || {}; UI.abVotes[win] = (UI.abVotes[win] || 0) + 1; UI.abRound = (UI.abRound || 0) + 1;
  const total = Object.values(UI.abVotes).reduce((x, y) => x + y, 0);
  if (total >= 3) {
    const best = Object.entries(UI.abVotes).sort((x, y) => y[1] - x[1])[0][0];
    S.settings.ttsEngine = best; persist(); UI.ab = null; UI.abVotes = null; UI.abRound = 0;
    toast(`You picked ${TTS_NAMES[best]}. Forge will use it everywhere.`); render(); return;
  }
  UI.ab = null; render(); setTimeout(abPlay, 300);
}

/* ---------- boot ---------- */
(() => { // home-screen shortcuts: /?go=drive | teacher | session
  const go = new URLSearchParams(location.search).get('go');
  if (go === 'drive' || go === 'teacher') UI.view = go;
  if (go === 'session') { try { startSession(false); UI.view = 'session'; } catch (e) { } }
  if (go) try { history.replaceState(null, '', location.pathname); } catch (e) { }
